[package]
name = "tm-player"
version = "0.1.0"
description = "A terminal interface music player"
authors = ["Daniel <101189638+cheestree@users.noreply.github.com>"]
license = "MIT"
edition = "2024"

[dependencies]
cli-log = "2.1.0"
color-eyre = "0.6.3"
crossterm = "0.29.0"
lofty = "0.22.4"
rand = "0.8"
ratatui = "0.30.0"
rodio = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
